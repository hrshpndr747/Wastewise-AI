services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      WASTEWISE_MODEL_PATH: artifacts/best_model.keras
      WASTEWISE_LABELS_PATH: artifacts/labels.json
      WASTEWISE_CONFIDENCE_THRESHOLD: "0.80"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
